<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduTech - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🎓 EduTech
        </div>

        <h1>Welcome Back</h1>

        <p class="auth-subtitle">
            Continue your personalized learning journey
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit"
                    class="auth-btn">

                Login

            </button>

        </form>

        <p id="loginMessage"
           class="auth-message"></p>

        <p class="switch-auth">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </p>

    </div>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document
        .getElementById("loginEmail")
        .value;

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const message =
        document
        .getElementById("loginMessage");

    try {

        const response =
            await fetch("/api/login", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })

            });

        const data =
            await response.json();

        if (data.success) {

            message.textContent =
                "Login successful!";

            message.className =
                "auth-message success";

            setTimeout(function() {

                window.location.href = "/";

            }, 500);

        }

        else {

            message.textContent =
                data.message;

            message.className =
                "auth-message error";

        }

    }

    catch (error) {

        message.textContent =
            "Something went wrong.";

        message.className =
            "auth-message error";

    }

});

</script>

</body>

</html>
