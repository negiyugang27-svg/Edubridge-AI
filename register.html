<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduTech - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="auth-body">

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            🎓 EduTech
        </div>

        <h1>Create Account</h1>

        <p class="auth-subtitle">
            Start your personalized learning journey
        </p>

        <form id="registerForm">

            <label>Full Name</label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Minimum 6 characters"
                required
            >

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >

            <button type="submit"
                    class="auth-btn">

                Create Account

            </button>

        </form>

        <p id="registerMessage"
           class="auth-message"></p>

        <p class="switch-auth">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>

    </div>

</div>

<script>

document
.getElementById("registerForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
        document
        .getElementById("registerName")
        .value
        .trim();

    const email =
        document
        .getElementById("registerEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("registerPassword")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;

    const message =
        document
        .getElementById("registerMessage");

    if (password !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        message.className =
            "auth-message error";

        return;
    }

    try {

        const response =
            await fetch("/api/register", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })

            });

        const data =
            await response.json();

        if (data.success) {

            message.textContent =
                "Account created successfully!";

            message.className =
                "auth-message success";

            setTimeout(function() {

                window.location.href = "/";

            }, 700);

        }

        else {

            message.textContent =
                data.message;

            message.className =
                "auth-message error";

        }

    }

    catch (error) {

        message.textContent =
            "Something went wrong.";

        message.className =
            "auth-message error";

    }

});

</script>

</body>

</html>
